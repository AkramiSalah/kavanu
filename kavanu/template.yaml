AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kavanu

  Sample SAM Template for kavanu

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 60

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:
  CreateAppointmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: ddb-interactions/create-appointment/
      Handler: app.createAppointment
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /create-appointment
            Method: post

  RetriveAppointmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: ddb-interactions/retrive-appointment/
      Handler: app.retriveAppointment
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /retrive-appointment
            Method: get
  CandelAppointmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: ddb-interactions/cancel-appointment/
      Handler: app.cancelAppointment
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /cancel-appointment
            Method: delete
  UpdateClientAmountFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: ddb-interactions/update-client-amount/
      Handler: app.updateClientAmount
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /update-appointment
            Method: delete
 # utility functions  
  GetTableItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ddb-interactions/utils/get-table-items/
      Handler: app.getTableItems
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Events:
        GetTableItems:
          Type: Api
          Properties:
            Path: /table
            Method: get

  ResetDynamoDBTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ddb-interactions/utils/reset-table/
      Handler: app.resetTable 
      Runtime: nodejs20.x 
      Architectures:
        - x86_64
      Events:
        ResetTableEvent:
          Type: Api
          Properties:
            Path: /reset-table
            Method: post
